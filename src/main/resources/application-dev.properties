# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aque}
spring.datasource.username=${DB_USER:aque_user}
spring.datasource.password=${DB_PASS:123@Mudar}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.show-sql=true
# JWT (default só em dev — nunca herdado em prod)
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-never-use-in-production-minimum-256-bits}
# Logging
logging.level.com.aque=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO