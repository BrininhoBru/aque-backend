spring.profiles.active=dev
spring.application.name=aque-backend
server.servlet.context-path=/api
spring.output.ansi.enabled=always
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# JWT (sem valor default — falha o boot se JWT_SECRET não for definido)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# CORS
# Vazio por padrão: hoje front e back são same-origin (proxy dev / nginx prod), então nada
# cross-origin deve ser permitido até que a topologia mude.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Upload (import de posição da B3)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
#Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha