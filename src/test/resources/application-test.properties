# Datasource — injetado pelo Testcontainers via @ServiceConnection (ver TestcontainersConfiguration)
# JPA — valida entidades contra o schema real, gerado pelas migrations Flyway abaixo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway — roda as mesmas migrations de produção
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# JWT (valor fixo para testes)
app.jwt.secret=test-secret-key-for-unit-tests-only-minimum-256-bits-long
app.jwt.expiration-ms=3600000
# CORS (uma origem permitida para os testes de SecurityConfigTest)
app.cors.allowed-origins=http://localhost:4200
